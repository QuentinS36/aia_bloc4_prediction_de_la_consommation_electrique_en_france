name: CI/CD etl

on:
  push:
    branches: [main, develop]
    paths: ['dday/**', 'tests/**', 'requirements/**', 'docker/Dockerfile.etl', '.github/workflows/etl.yml']
  pull_request:
    paths: ['dday/**', 'tests/**', 'requirements/**', 'docker/Dockerfile.etl']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/etl.txt -r requirements/test.txt
      - run: python -m pytest -q tests/test_etl.py

  docker:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.etl
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dday-etl:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dday-etl:${{ github.sha }}
