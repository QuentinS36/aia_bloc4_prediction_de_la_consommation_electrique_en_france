name: CI DAG Airflow

on:
  push:
    branches: [main, develop]
    paths: ['airflow/**', 'tests/test_dag.py', 'tests/test_check_config.py', '.github/workflows/dag.yml']
  pull_request:
    paths: ['airflow/**', 'tests/test_dag.py', 'tests/test_check_config.py', '.github/workflows/dag.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Airflow et les outils de test
        run: |
          pip install "apache-airflow==2.10.5" apache-airflow-providers-ssh apache-airflow-providers-amazon pytest "moto[ec2]" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: Tester le DAG (structure, branchement, gestion des instances EC2 simulées)
        run: python -m pytest -q --noconftest tests/test_dag.py tests/test_check_config.py
